name: Generate TI Screenshots

on:
  workflow_dispatch:
    inputs:
      macro_file:
        description: "Optional TilEm macro file path (example: .github/tilem/screenshot.macro)"
        required: false
        default: ""
        type: string
      capture_delays_seconds:
        description: "Comma-separated capture offsets after launch (4 values)"
        required: false
        default: "8,14,20,26"
        type: string
      commit_changes:
        description: "Create or update a PR with generated BMPs, GIF, and README update"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      SHOT_NAMES: "01MENU,02PROBLEMINPUT,03OUTPUT,INFO"
      TI83P_ROM_BASE64: ${{ secrets.TI83P_ROM_BASE64 }}
      MACRO_FILE: ${{ inputs.macro_file }}
      CAPTURE_DELAYS: ${{ inputs.capture_delays_seconds }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate ROM secret
        run: |
          set -euo pipefail
          if [ -z "${TI83P_ROM_BASE64}" ]; then
            echo "Missing required secret: TI83P_ROM_BASE64"
            exit 1
          fi

      - name: Install open-source emulator tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tilem xdotool imagemagick

      - name: Generate screenshots with TilEm2
        run: |
          set -euo pipefail
          xvfb-run -a bash .github/scripts/generate_tilem_screenshots.sh

      - name: Upload generated screenshots
        uses: actions/upload-artifact@v4
        with:
          name: generated-screenshots
          path: |
            doc/01MENU.BMP
            doc/02PROBLEMINPUT.BMP
            doc/03OUTPUT.BMP
            doc/INFO.BMP
            doc/DEMO.gif
            README.md
          if-no-files-found: error

      - name: Create or update pull request
        if: ${{ inputs.commit_changes }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Regenerate calculator screenshots and README demo gif"
          title: "Regenerate calculator screenshots and README demo gif"
          body: |
            This PR was generated by the screenshot workflow.

            Updated files:
            - `doc/01MENU.BMP`
            - `doc/02PROBLEMINPUT.BMP`
            - `doc/03OUTPUT.BMP`
            - `doc/INFO.BMP`
            - `doc/DEMO.gif`
            - `README.md`
          branch: chore/update-generated-screenshots
          delete-branch: true
          add-paths: |
            doc/01MENU.BMP
            doc/02PROBLEMINPUT.BMP
            doc/03OUTPUT.BMP
            doc/INFO.BMP
            doc/DEMO.gif
            README.md
